<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1800" viewBox="0 0 900 1800">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#d8effb"/>
  <stop offset=".48" stop-color="#e8f5fb"/>
  <stop offset="1" stop-color="#d8f0ec"/>
 </linearGradient>
 <linearGradient id="river" x1="0" y1="0" x2="1" y2="0">
  <stop stop-color="#80c7e8" stop-opacity=".65"/>
  <stop offset=".5" stop-color="#b2e0f3" stop-opacity=".72"/>
  <stop offset="1" stop-color="#6eb9df" stop-opacity=".58"/>
 </linearGradient>
 <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1">
  <stop stop-color="#8fc8d8" stop-opacity=".62"/>
  <stop offset="1" stop-color="#b8e0df" stop-opacity=".3"/>
 </linearGradient>
 <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
  <stop offset="0" stop-color="#ffffff" stop-opacity=".12"/>
  <stop offset=".22" stop-color="#ffffff" stop-opacity=".08"/>
  <stop offset=".7" stop-color="#ffffff" stop-opacity=".18"/>
  <stop offset="1" stop-color="#ffffff" stop-opacity=".35"/>
 </linearGradient>
</defs>
<rect width="900" height="1800" fill="url(#bg)"/>
